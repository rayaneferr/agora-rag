[project]
name = "agora-rag"
version = "0.1.0"
description = "Agent conversationnel RAG exposé via MCP (cinéma + Assemblée nationale)"
authors = [
    { name = "Rayane", email = "rferrat@luccasoftware.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.103.0",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "polars>=1.44.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
agora-chat = "agora.client:main"
mcp-cinema = "agora.servers.cinema:main"
mcp-assemblee = "agora.servers.assemblee:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agora"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# torch CPU sous Linux (CI, Docker) : évite plusieurs Go de binaires CUDA inutiles.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
