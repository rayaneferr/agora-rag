[project]
name = "agora-rag"
version = "0.1.0"
description = "Agents conversationnels locaux, un par contexte (base indexée + serveur MCP) : cinéma, Assemblée nationale"
authors = [
    { name = "Rayane", email = "rferrat@luccasoftware.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lancedb>=0.39.0",
    "litellm>=1.103.0",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "polars>=1.44.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
agora = "agora.adapters.inbound.api:main"
agora-chat = "agora.adapters.inbound.cli:main"
agora-index = "agora.adapters.outbound.index_hub:main"
mcp-cinema = "agora.contexts.cinema.server:main"
mcp-assemblee = "agora.contexts.assemblee.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agora"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# torch CPU sous Linux (CI, Docker) : évite plusieurs Go de binaires CUDA inutiles.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
