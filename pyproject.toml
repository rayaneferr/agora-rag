[project]
name = "agora-rag"
version = "0.1.0"
description = "Agent conversationnel RAG exposé via MCP (cinéma + Assemblée nationale)"
authors = [
    { name = "Rayane", email = "rferrat@luccasoftware.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.103.0",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "polars>=1.44.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
agora-chat = "agora.client:main"
mcp-cinema = "agora.servers.cinema:main"
mcp-assemblee = "agora.servers.assemblee:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agora"
